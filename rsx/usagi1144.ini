;
;  PDP-11/44 -- replica of the machine the FPS-100 is going onto.
;  Hardware per the build videos (transcripts/); see PDP11_44_TARGET.md.
;
;  Boot with:  pdp11 usagi1144.ini
;
; ---- processor ------------------------------------------------------
set cpu 11/44                   ; Unibus.  An 11/73 is Q-bus and SimH
                                ; then disables RK, HK and TM outright.
set cpu 4M                      ; reports 4088KB -- 4 MB less the I/O page
set cpu fpp                     ; floating point option
set cpu cis                     ; commercial instruction set
;
; ---- fixed disk -----------------------------------------------------
;  Fujitsu 2312, 8-inch SMD, 84 MB, behind an Emulex SC12 that presents
;  it to the Unibus as an RK611 with two RK07 and one RK06.  SimH's HK
;  is that controller; its RK device is the RK11/RK05 and is NOT this.
set hk enabled
set hk0 rk07                    ; DM0:  label USAGI0
set hk1 rk07                    ; DM1:
set hk2 rk06                    ; DM2:
set hk3 disabled
set hk4 disabled
set hk5 disabled
set hk6 disabled
set hk7 disabled
att hk0 usagi0.dsk
att hk1 usagi1.dsk
att hk2 usagi2.dsk
;
; ---- removable ------------------------------------------------------
set tdc enabled                 ; TU58 DECtape II
att tdc0 tu58.tap
;
; ---- terminals ------------------------------------------------------
set dz enabled                  ; DZ11, 16 lines
set dz lines=16
;
; ---- network --------------------------------------------------------
set xu enabled                  ; DELUA (SimH's XU defaults to DELUA)
;
; ---- not present on the target --------------------------------------
set rk disabled                 ; no RK05
set rl disabled
set rq disabled
set tm disabled
;
; The RSX-11M V3.1 pack in this directory has NO RK611 driver -- booted
; here, DEV DM: answers DEVICE NOT IN SYSTEM.  Using these drives needs a
; system generated with the DM: driver.  Until then, boot that pack on
; the RK05 configuration instead (see the build .ini files).
;
