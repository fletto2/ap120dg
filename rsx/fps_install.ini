set cpu 11/44
set cpu 4M
set cpu fpp
set cpu cis
set console log=full.log
set rl enabled
set rl0 rl02
set rl1 rl02
set rl2 rl02
set rl3 rl02
att rl0 m40.run4/rsxm32.dsk
att rl1 m40.run4/excprv.dsk
att rl2 fps1.dsk
att rl3 fps2.dsk
set hk enabled
set hk0 rk07
set hk1 rk07
set hk2 rk06
att -n hk0 m40.run4/usagi0.dsk
att -n hk1 m40.run4/usagi1.dsk
att -n hk2 m40.run4/usagi2.dsk
set dz enabled
expect "PLEASE ENTER TIME AND DATE" send after=15000000,delay=250000,"12:00 09-AUG-86\r"; continue
expect "ENTER LINE WIDTH" send after=15000000,delay=250000,"\r"; continue
expect "@ <EOF>" send after=200000000,delay=250000,"\003\rINS $PIP\r"; continue
expect "INS $PIP" send after=400000000,delay=250000,"\003\rINS $INI\r"; continue
expect "INS $INI" send after=400000000,delay=250000,"\003\rALL DM0:\r"; continue
expect "ALL DM0:" send after=400000000,delay=250000,"\003\rINI DM0:USAGI0/BAD=[NOAUTO]\r"; continue
expect "INI DM0:USAGI0" send after=2000000000,delay=250000,"\003\rMOU DM0:USAGI0\r"; continue
expect "MOU DM0:USAGI0" send after=2000000000,delay=250000,"\003\rUFD DM0:[200,200]\r"; continue
expect "UFD DM0:" send after=1000000000,delay=250000,"\003\rMOU DL2:FPS101\r"; continue
expect "MOU DL2:FPS101" send after=1500000000,delay=250000,"\003\rPIP DM0:[200,200]/NV=DL2:[200,200]*.*\r"; continue
expect "NV=DL2" send after=2000000000,delay=250000,"\003\rMOU DL3:FPS102\r"; continue
expect "MOU DL3:FPS102" send after=1500000000,delay=250000,"\003\rPIP DM0:[200,200]/NV=DL3:[200,200]*.*\r"; continue
expect "NV=DL3" send after=2000000000,delay=250000,"\003\rPIP DM0:[200,200]*.*/LI\r"; continue
boot rl0
