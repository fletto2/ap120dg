; boot_rsx.ini -- boot the RSX-11M 3.1 pack that has FORTRAN IV installed.
;
; Run:  pdp11 boot_rsx.ini
; Get the disk image first with ./fetch_kits.sh
;
; The startup command file installs $EDI, $PIP and $FOR, so the FORTRAN IV
; compiler is available at the MCR ">" prompt as "FOR".
;
; The expect/send rule answers the date prompt automatically. SimH reads
; simulated-console input through these rules, not from stdin, so a bare
; pipe into the simulator will not reach the running system.

set cpu 11/70
set cpu 256k

; REQUIRED. Without FPP the task builder dies with
;   TASK "TT0   " TERMINATED  /  RESERVED INST EXECUTION
set cpu fpp

set console log=console.log

set rk0 rk05
att rk0 rsx31wStr11andFtn.dsk

expect "[S]: " send "12:00 07-AUG-86\r"; continue

boot rk0
