set cpu 11/44
set cpu 4M
set cpu fpp
set rl enabled
set hk enabled
set console log=lodrec.log
att hk0 sysbig.dsk
att rl1 lodrec.dsk
expect "PLEASE ENTER TIME AND DATE" send after=15000000,delay=250000,"12:00 09-AUG-86\r"; continue
expect "ENTER LINE WIDTH" send after=15000000,delay=250000,"\r"; continue
expect "@ <EOF>" send after=3000000,delay=250000,"\003\rMOU DL1:LODREC\r"; continue
expect "MOU DL1:LODREC" send after=5000000,delay=250000,"\003\rSET /UIC=[200,200]\rASN DL1:=SY:\r@DL1:[200,200]LODREC\r"; continue
boot hk0
