set cpu 11/44
set cpu 4M
set cpu fpp
set rl enabled
set hk enabled
set console log=wb2.log
att rl0 rsxm32.dsk
att hk0 sysbig.dsk
expect "PLEASE ENTER TIME AND DATE" send after=15000000,delay=250000,"12:00 09-AUG-86\r"; continue
expect "ENTER LINE WIDTH" send after=15000000,delay=250000,"\r"; continue
expect "@ <EOF>" send after=3000000,delay=250000,"\003\rINS $BOO\rMOU DM0:RSXBIG\r"; continue
expect "MOU DM0:RSXBIG" send after=6000000,delay=250000,"\003\rBOO DM0:[1,54]RSX11M.SYS\r"; continue
expect "RSX11M V4.0 BL32" send after=25000000,delay=300000,"\r12:00 09-AUG-86\r\rINS $SAV\r\rSAV /WB\r"; continue
boot rl0
