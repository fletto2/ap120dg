; Assemble one basic-math routine with the INSTALLED ASM100 and keep the
; LISTING, which gives the PS-address-to-source mapping.  Every attempt to
; guess that mapping in this project has been wrong; see CLAUDE.md.
;
; NOTE the monitor must NOT match on "ERROR" -- ASM100's own prompt is
; "LIST AND ERROR FILE=", so an ERROR-matching rule kills the run at once.
set cpu 11/44
set cpu 4M
set cpu fpp
set hk enabled
set console log=asmlst.log
att hk0 sysbig.dsk
att hk1 usagi0.dsk
att hk2 asmsrc.dsk
expect "PLEASE ENTER TIME AND DATE" send after=15000000,delay=250000,"12:00 09-AUG-86\r"; continue
expect "ENTER LINE WIDTH" send after=15000000,delay=250000,"\r"; continue
expect "@ <EOF>" send after=3000000,delay=250000,"\003\rINS $PIP\r"; continue
expect "INS $PIP" send after=4000000,delay=250000,"\003\rMOU DM1:USAGI0\r"; continue
expect "MOU DM1:USAGI0" send after=5000000,delay=250000,"\003\rMOU DM2:ASMSRC\r"; continue
expect "MOU DM2:ASMSRC" send after=5000000,delay=250000,"\003\rASN DM2:=SY:\r"; continue
expect "ASN DM2:=SY:" send after=5000000,delay=250000,"\003\rSET /UIC=[200,200]\r"; continue
expect "SET /UIC" send after=5000000,delay=250000,"\003\rRUN DM1:[100,100]ASM100\r"; continue
expect "SOURCE FILE=" send after=60000000,delay=250000,"RTN.APS\r"; continue
expect "OBJECT FILE=" send after=20000000,delay=250000,"NL:\r"; continue
expect "LIST AND ERROR FILE=" send after=20000000,delay=250000,"RTN.LST\r"; continue
expect "LISTING? (Y/N)" send after=20000000,delay=250000,"Y\r"; continue
expect "LISTING RADIX" send after=20000000,delay=250000,"8\r"; continue
expect "ASSEMBLY COMPLETED" send after=20000000,delay=250000,"\003\r"; continue
boot hk0
