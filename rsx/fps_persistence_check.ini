set cpu 11/44
set cpu 4M
set cpu fpp
set rl enabled
set hk enabled
set console log=persist.log
att rl0 fps.installed/rsxm32.dsk
att hk0 fps.installed/usagi0.dsk
expect "PLEASE ENTER TIME AND DATE" send after=15000000,delay=250000,"12:00 09-AUG-86\r"; continue
expect "ENTER LINE WIDTH" send after=15000000,delay=250000,"\r"; continue
expect "@ <EOF>" send after=3000000,delay=250000,"\003\rINS $PIP\r"; continue
expect "INS $PIP" send after=3000000,delay=250000,"\003\rMOU DM0:USAGI0\r"; continue
expect "MOU DM0:USAGI0" send after=3000000,delay=250000,"\003\rPIP DM0:[1,1]MATHLIB.OLB,APLIB.LIB,LIB100.OLB/LI\r"; continue
expect "MATHLIB" send after=3000000,delay=250000,"\003\rPIP DM0:[100,100]APDRV.TSK,APDEV.TSK/LI\r"; continue
expect "APDEV" send after=3000000,delay=250000,"\003\rPIP DM0:[100,100]*.*/LI/TB\r"; continue
expect "Total of" send after=5000000,delay=250000,"\003\rECHO PERSIST-OK\r"; continue
boot rl0
