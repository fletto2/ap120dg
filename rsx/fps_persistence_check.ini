set cpu 11/44
set cpu 4M
set cpu fpp
set hk enabled
set console log=persist2.log
att hk0 fps.installed/sysbig.dsk
att hk1 fps.installed/usagi0.dsk
expect "PLEASE ENTER TIME AND DATE" send after=15000000,delay=250000,"12:00 09-AUG-86\r"; continue
expect "ENTER LINE WIDTH" send after=15000000,delay=250000,"\r"; continue
expect "@ <EOF>" send after=3000000,delay=250000,"\003\rINS $PIP\r"; continue
expect "INS $PIP" send after=4000000,delay=250000,"\003\rMOU DM1:USAGI0\r"; continue
expect "MOU DM1:USAGI0" send after=5000000,delay=250000,"\003\rPIP LB:[1,1]LIB100.OLB,MATHLIB.OLB,APLIB.LIB/LI\r"; continue
expect "APLIB.LIB;" send after=5000000,delay=250000,"\003\rPIP DM1:[100,100]*.TSK/LI\r"; continue
boot hk0
