set cpu 11/70
set cpu 256k
set cpu fpp
set console log=asmbuild.log
set rk0 rk05
set rk1 rk05
att rk0 rsx31wStr11andFtn.dsk
att rk1 build.dsk
expect "[S]: " send after=15000000,delay=250000,"12:00 07-AUG-86\r"; continue
expect "@ <EOF>" send after=400000000,delay=250000,"\rMOU DK1:ASMBLD\r"; continue
expect "MOU DK1:ASMBLD" send after=1000000000,delay=250000,"\r@DK1:BUILD\r"; continue
expect "SOURCE FILE=" send after=200000000,delay=250000,"DGNSRC.APS\r"; continue
expect "SOURCE FILE=" send after=200000000,delay=250000,"DGNSRC.APS\r"; continue
expect "OBJECT FILE=" send after=200000000,delay=250000,"DGNOBJ.APO\r"; continue
expect "OBJECT FILE=" send after=200000000,delay=250000,"DGNOBJ.APO\r"; continue
expect "LIST AND ERROR FILE=" send after=200000000,delay=250000,"NL:\r"; continue
expect "LIST AND ERROR FILE=" send after=200000000,delay=250000,"NL:\r"; continue
expect "LISTING? (Y/N)" send after=200000000,delay=250000,"N\r"; continue
expect "LISTING? (Y/N)" send after=200000000,delay=250000,"N\r"; continue
boot rk0
