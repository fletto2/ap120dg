set cpu 11/44
set cpu 4M
set cpu fpp
set cpu cis
set console log=faith.log
set rl enabled
set rl0 rl02
set rl1 rl02
set rl2 rl02
att hk0 sysbig.dsk
att rl2 faith.dsk
set hk enabled
att hk1 usagi0.dsk
set dz enabled
expect "PLEASE ENTER TIME AND DATE" send after=15000000,delay=250000,"12:00 09-AUG-86\r"; continue
expect "ENTER LINE WIDTH" send after=15000000,delay=250000,"\r"; continue
expect "@ <EOF>" send after=200000000,delay=250000,"\003\rMOU DL2:FAITH\r"; continue
expect "MOU DL2:FAITH" send after=600000000,delay=250000,"\003\r@DL2:[200,200]FAITH\r"; continue
expect "ENTER CSR LOCATION FOR AP # 0" send after=200000000,delay=250000,"\r"; continue
expect "ENTER VECTOR LOCATION FOR AP # 0" send after=200000000,delay=250000,"\r"; continue
expect "DELETE APEX AND UTILITIES SOURCES" send after=200000000,delay=250000,"N\r"; continue
expect "DELETE HSR SOURCES" send after=200000000,delay=250000,"N\r"; continue
expect "IS YOUR HOST CPU A PDP-11/70" send after=200000000,delay=250000,"N\r"; continue
boot hk0
