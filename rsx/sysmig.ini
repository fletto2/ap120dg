set cpu 11/44
set cpu 4M
set cpu fpp
set rl enabled
set hk enabled
set console log=mig.log
att rl0 rsxm32.dsk
att rl1 mig.dsk
att -n -b hk1 sysbig.dsk
expect "PLEASE ENTER TIME AND DATE" send after=15000000,delay=250000,"12:00 09-AUG-86\r"; continue
expect "ENTER LINE WIDTH" send after=15000000,delay=250000,"\r"; continue
expect "@ <EOF>" send after=3000000,delay=250000,"\003\rMOU DL1:MIG\r"; continue
expect "MOU DL1:MIG" send after=3000000,delay=250000,"\003\r@DL1:[200,200]SYSMIG\r"; continue
boot rl0
