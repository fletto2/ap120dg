set cpu 11/44
set cpu 4M
set cpu fpp
set rl enabled
set hk enabled
set console log=vmr.log
att rl0 rsxm32.dsk
att rl1 vmrb.dsk
att hk0 sysbig.dsk
expect "PLEASE ENTER TIME AND DATE" send after=15000000,delay=250000,"12:00 09-AUG-86\r"; continue
expect "ENTER LINE WIDTH" send after=15000000,delay=250000,"\r"; continue
expect "@ <EOF>" send after=3000000,delay=250000,"\003\rMOU DL1:VMRB\r"; continue
expect "MOU DL1:VMRB" send after=5000000,delay=250000,"\003\r@DL1:[200,200]VMRBLD\r"; continue
boot rl0
