; Run ONE reference job through the INSTALLED recovered LOD100 (LODHYB) on
; the 11/44 replica and keep its outputs.  No build: LODHYB.TSK lives on
; the work pack, so this boots, mounts, and runs.
set cpu 11/44
set cpu 4M
set cpu fpp
set hk enabled
set console log=refjob.log
att hk0 sysbig.dsk
att hk1 usagi0.dsk
att hk2 refdata.dsk
expect "PLEASE ENTER TIME AND DATE" send after=15000000,delay=250000,"12:00 09-AUG-86\r"; continue
expect "ENTER LINE WIDTH" send after=15000000,delay=250000,"\r"; continue
expect "@ <EOF>" send after=3000000,delay=250000,"\003\rINS $PIP\r"; continue
expect "INS $PIP" send after=4000000,delay=250000,"\003\rMOU DM1:USAGI0\r"; continue
expect "MOU DM1:USAGI0" send after=5000000,delay=250000,"\003\rMOU DM2:REFDATA\r"; continue
expect "MOU DM2:REFDATA" send after=5000000,delay=250000,"\003\rASN DM2:=SY:\r"; continue
expect "ASN DM2:=SY:" send after=5000000,delay=250000,"\003\rSET /UIC=[200,200]\r"; continue
expect "SET /UIC" send after=5000000,delay=250000,"\003\rRUN DM1:[100,100]LODHYB\r"; continue
expect "RECONSTRUCTION" send after=8000000,delay=250000,"\003\rINPUT JOB.CMD\r"; continue
expect "TT0  --  STOP" send after=20000000,delay=250000,"\003\r"; continue
boot hk0
